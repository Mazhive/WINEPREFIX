# emulation.conf — koppelt systeem-sleutels aan emulators voor game-gui-fork.py
#
# Velden per sectie [systeem-sleutel]:
#   title      = weergave-naam
#   emu        = volledig pad naar de emulator (leeg = nog niet geconfigureerd)
#   args       = argumenten; %ROM% wordt vervangen door het game-pad (iso/cue/map)
#   status     = ok | missing
#   accept_dir = 1 als de emulator een MAP als argument accepteert (bijv. RPCS3)
#
# Hoe voeg je een systeem toe? Zie README-game-gui-fork.md.

[psx]
title=PlayStation (PS1)
emu=/mnt/VG_00/PUBLIC-LIBRARY/EMU/SONY/PSX/duckstation-qt-x64.AppImage
args=%ROM%
status=ok

[ps2]
title=PlayStation 2 (PS2)
emu=
args=%ROM%
status=missing

[ps3]
title=PlayStation 3 (PS3)
emu=/mnt/VG_00/PUBLIC-LIBRARY/EMU/SONY/PSX3/rpcs3-v0.0.22-13538-c14e79f8_linux64.AppImage
args=--no-gui %ROM%
status=ok
accept_dir=1

[psp]
title=PlayStation Portable (PSP)
emu=
args=%ROM%
status=missing

[xbox]
title=Xbox (OG)
emu=/mnt/VG_00/PUBLIC-LIBRARY/EMU/MICROSOFT/OG.XBOX/xemu-0.8.135-x86_64.appimage
args=-dvd %ROM%
status=ok

